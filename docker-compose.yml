services:
  db:
    image: pgvector/pgvector:pg16
    container_name: image-relevance-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: image_relevance
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d image_relevance"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:

