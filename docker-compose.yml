services:
  db:
    image: pgvector/pgvector:pg16
    container_name: image-relevance-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: image_relevance
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d image_relevance"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    container_name: image-relevance-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://appuser:apppassword@db:5432/image_relevance
      EMBEDDING_PROVIDER: local
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PEXELS_API_KEY: ${PEXELS_API_KEY}
      # guard thresholds, tuned with npm run tune, empty default = code fallback
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-}
      NO_OVERLAP_THRESHOLD: ${NO_OVERLAP_THRESHOLD:-}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-}
    ports:
      - '3000:3000'
    volumes:
      # images uploaded through the UI persist here
      - ./data/images:/app/data/images
      # bind-mounted host cache: the embedding model is downloaded once by the
      # CLI scripts (batch, reembed) and the container reuses it instead of
      # re-fetching from the Hugging Face hub at request time
      - ./.cache:/app/.cache

volumes:
  pgdata:
